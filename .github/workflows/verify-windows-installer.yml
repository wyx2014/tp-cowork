name: Verify Windows installer

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Build run containing the installer artifact'
        required: true
        default: '39392660853'
      artifact_name:
        description: 'Installer artifact name'
        required: true
        default: TPCowork-windows-x64-4-1
      clean_machine:
        description: 'Diagnose an existing installer without the legacy nanobot registration'
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  install:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run_id }}
          name: ${{ inputs.artifact_name }}
          path: installer
      - name: Verify installation, upgrade and installed product
        shell: pwsh
        env:
          CLEAN_MACHINE: ${{ inputs.clean_machine }}
        run: ./scripts/smoke-windows-installer.ps1 -InstallerDirectory installer -CleanMachine:($env:CLEAN_MACHINE -eq 'true')
      - name: Retain installed UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installed-ui-${{ github.run_id }}
          path: test-results/windows-install/
          if-no-files-found: warn
