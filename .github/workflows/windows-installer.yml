name: Build Windows Installer

on:
  workflow_dispatch:
    inputs:
      harness_repository:
        description: '底座 fork 仓库（账号/deepseek-harness）'
        type: string
        default: wyx2014/deepseek-harness
        required: true
      harness_ref:
        description: '要打包的底座分支、标签或 commit（需包含产品打包接口）'
        type: string
        default: feat/tpcowork-workbench-ui
        required: true
      build_version:
        description: '构建版本：auto 自动编号'
        type: string
        default: auto
        required: true
      deployment:
        description: 'standalone 为独立测试包；test/production 需要更新策略服务'
        type: choice
        options: [standalone, test, production]
        default: standalone
        required: true
      policy_origin:
        description: '策略服务 HTTPS origin（不含路径；可在仓库 Variable PACKAGE_POLICY_ORIGIN 设置默认值）'
        type: string
        required: false
      login_origins:
        description: '测试登录 HTTPS origin，多个用逗号分隔（可设置 Variable PACKAGE_LOGIN_ORIGINS）'
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-installer:
    runs-on: windows-2022
    timeout-minutes: 180
    defaults:
      run:
        shell: pwsh
        working-directory: tp-cowork
    env:
      DSH_TELEMETRY_DISABLED: '1'
    steps:
      - name: Enable long source paths
        working-directory: ${{ runner.temp }}
        run: |
          git config --global core.longpaths true
          exit $LASTEXITCODE
      - name: Checkout TP Cowork
        uses: actions/checkout@v4
        with:
          path: tp-cowork
          persist-credentials: false
      - name: Checkout harness fork
        id: harness
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.harness_repository }}
          ref: ${{ inputs.harness_ref }}
          path: deepseek-harness
          token: ${{ secrets.HARNESS_READ_TOKEN || github.token }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tp-cowork/package-lock.json
      - name: Set up Python for native build tools
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64
      - name: Install product build tools
        run: npm ci
      - name: Resolve pnpm store directory
        id: pnpm-store
        run: |
          $storePath = node node_modules/pnpm/bin/pnpm.cjs store path
          "path=$storePath" >> $env:GITHUB_OUTPUT
      # These caches hold content-addressed or hash-verified downloads (pnpm's store, the
      # harness's locked interpreter archives, the pinned Chromium build, the pinned wheel).
      # A stale or missing entry just falls back to a normal download, so a bad cache can
      # slow a run down but never serves wrong content. Each only pays off once populated
      # by a prior run with a matching lockfile/pin hash.
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-windows-${{ hashFiles('deepseek-harness/pnpm-lock.yaml') }}
          restore-keys: pnpm-store-windows-
      - name: Cache harness primary runtime downloads
        uses: actions/cache@v4
        with:
          path: deepseek-harness/apps/desktop/.desktop-build/downloads
          key: primary-runtime-downloads-windows-${{ hashFiles('deepseek-harness/scripts/primary-runtime/lock.json') }}
      - name: Cache toolbox Playwright Chromium
        uses: actions/cache@v4
        with:
          path: tp-cowork/plugins/tpcowork-toolbox/runtime/browsers
          key: toolbox-playwright-chromium-windows-${{ hashFiles('tp-cowork/plugins/tpcowork-toolbox/package-lock.json') }}
      - name: Cache toolbox Windows Python wheels
        uses: actions/cache@v4
        with:
          path: tp-cowork/.cache/toolbox-windows-wheels
          key: toolbox-windows-wheels-${{ hashFiles('tp-cowork/plugins/tpcowork-toolbox/runtime-scripts/requirements-windows-x64-py312.txt') }}
      - name: Install harness build dependencies
        run: node node_modules/pnpm/bin/pnpm.cjs --dir ../deepseek-harness install --frozen-lockfile
      - name: Verify packaging helpers
        run: npm run test:packaging
      - name: Build TP Cowork Windows installer
        env:
          PACKAGE_BUILD_VERSION: ${{ inputs.build_version }}
          PACKAGE_DEPLOYMENT: ${{ inputs.deployment }}
          PACKAGE_POLICY_ORIGIN: ${{ inputs.policy_origin || vars.PACKAGE_POLICY_ORIGIN }}
          PACKAGE_LOGIN_ORIGINS: ${{ inputs.deployment == 'test' && (inputs.login_origins || vars.PACKAGE_LOGIN_ORIGINS) || '' }}
          TPCOWORK_DEEPSEEK_BASE_URL: ${{ vars.TPCOWORK_DEEPSEEK_BASE_URL }}
          TPCOWORK_DEEPSEEK_API_KEY: ${{ secrets.TPCOWORK_DEEPSEEK_API_KEY }}
        run: npm run build:win
      - name: Verify EXE installation and installed product
        run: ./scripts/smoke-windows-installer.ps1 -InstallerDirectory dist/installers
      - name: Diagnose browser bridge and expert toolbox (non-blocking)
        continue-on-error: true
        shell: pwsh
        run: ./scripts/smoke-windows-installer.ps1 -InstallerDirectory dist/installers -Diagnostics
      - name: Record packaged sources
        run: |
          Get-Content -LiteralPath dist/installers/build-info.json | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: TPCowork-windows-x64-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            tp-cowork/dist/installers/*.exe
            tp-cowork/dist/installers/*.sha256
            tp-cowork/dist/installers/build-info.json
          if-no-files-found: error
          retention-days: 30
      - name: Retain packaging diagnostics
        if: always() && steps.harness.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: windows-package-logs-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          path: deepseek-harness/apps/desktop/.desktop-build/packaging-runs/
          if-no-files-found: warn
          retention-days: 14
      - name: Retain installed UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installed-ui-${{ github.run_id }}
          path: tp-cowork/test-results/windows-install/
          if-no-files-found: warn
      - name: Retain unverified installer for diagnosis
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unverified-installer-${{ github.run_id }}
          path: tp-cowork/dist/installers/
          if-no-files-found: ignore
          retention-days: 7
