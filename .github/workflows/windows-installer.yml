name: Build Windows Installer

on:
  workflow_dispatch:
    inputs:
      harness_repository:
        description: '底座 fork 仓库（账号/deepseek-harness）'
        type: string
        default: wyx2014/deepseek-harness
        required: true
      harness_ref:
        description: '要打包的底座分支、标签或 commit（需包含产品打包接口）'
        type: string
        default: feat/tpcowork-workbench-ui
        required: true
      build_version:
        description: '构建版本：auto 自动编号'
        type: string
        default: auto
        required: true
      publish_release:
        description: '构建成功后发布 GitHub 预发行版，取消则只保留 Actions Artifacts'
        type: boolean
        default: true
        required: true
      deployment:
        description: 'standalone 为独立测试包；test/production 需要更新策略服务'
        type: choice
        options: [standalone, test, production]
        default: standalone
        required: true
      policy_origin:
        description: '策略服务 HTTPS origin（不含路径；可在仓库 Variable PACKAGE_POLICY_ORIGIN 设置默认值）'
        type: string
        required: false
      login_origins:
        description: '测试登录 HTTPS origin，多个用逗号分隔（可设置 Variable PACKAGE_LOGIN_ORIGINS）'
        type: string
        required: false

permissions:
  contents: write

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-installer:
    runs-on: windows-2022
    timeout-minutes: 180
    defaults:
      run:
        shell: pwsh
        working-directory: tp-cowork
    env:
      DSH_TELEMETRY_DISABLED: '1'
    steps:
      - name: Enable long source paths
        working-directory: ${{ runner.temp }}
        run: |
          git config --global core.longpaths true
          exit $LASTEXITCODE
      - name: Checkout TP Cowork
        uses: actions/checkout@v4
        with:
          path: tp-cowork
          persist-credentials: false
      - name: Checkout harness fork
        id: harness
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.harness_repository }}
          ref: ${{ inputs.harness_ref }}
          path: deepseek-harness
          token: ${{ secrets.HARNESS_READ_TOKEN || github.token }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tp-cowork/package-lock.json
      - name: Set up Python for native build tools
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64
      - name: Install product build tools
        run: npm ci
      - name: Resolve pnpm store directory
        id: pnpm-store
        run: |
          $storePath = node node_modules/pnpm/bin/pnpm.cjs store path
          "path=$storePath" >> $env:GITHUB_OUTPUT
      # These caches hold content-addressed or hash-verified downloads (pnpm's store, the
      # harness's locked interpreter archives, the pinned Chromium build, the pinned wheel).
      # A stale or missing entry just falls back to a normal download, so a bad cache can
      # slow a run down but never serves wrong content. Each only pays off once populated
      # by a prior run with a matching lockfile/pin hash.
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-windows-${{ hashFiles('deepseek-harness/pnpm-lock.yaml') }}
          restore-keys: pnpm-store-windows-
      - name: Cache harness primary runtime downloads
        uses: actions/cache@v4
        with:
          path: deepseek-harness/apps/desktop/.desktop-build/downloads
          key: primary-runtime-downloads-windows-${{ hashFiles('deepseek-harness/scripts/primary-runtime/lock.json') }}
      - name: Cache toolbox Playwright Chromium
        uses: actions/cache@v4
        with:
          path: tp-cowork/plugins/tpcowork-toolbox/runtime/browsers
          key: toolbox-playwright-chromium-windows-${{ hashFiles('tp-cowork/plugins/tpcowork-toolbox/package-lock.json') }}
      - name: Cache toolbox Windows Python wheels
        uses: actions/cache@v4
        with:
          path: tp-cowork/.cache/toolbox-windows-wheels
          key: toolbox-windows-wheels-${{ hashFiles('tp-cowork/plugins/tpcowork-toolbox/runtime-scripts/requirements-windows-x64-py312.txt') }}
      - name: Install harness build dependencies
        run: node node_modules/pnpm/bin/pnpm.cjs --dir ../deepseek-harness install --frozen-lockfile
      - name: Verify packaging helpers
        run: npm run test:packaging
      # The harness compile and pack stages depend only on the harness checkout (after branding),
      # the toolchain and public build settings. The harness keys its own snapshot on all of them
      # and rebuilds on any mismatch, so a plugin-only change restores the compiled harness instead
      # of rebuilding it. Saving under the snapshot's own key keeps a fresh build from being
      # shadowed by an older entry for the same harness commit.
      - name: Restore harness build
        id: harness-build
        uses: actions/cache/restore@v4
        with:
          path: deepseek-harness/apps/desktop/.desktop-build/build-cache
          key: harness-build-windows-${{ steps.harness.outputs.commit }}-
          restore-keys: harness-build-windows-${{ steps.harness.outputs.commit }}-
      - name: Build TP Cowork Windows installer
        env:
          DSH_DESKTOP_BUILD_CACHE_DIR: ${{ github.workspace }}/deepseek-harness/apps/desktop/.desktop-build/build-cache
          PACKAGE_BUILD_VERSION: ${{ inputs.build_version }}
          PACKAGE_DEPLOYMENT: ${{ inputs.deployment }}
          PACKAGE_POLICY_ORIGIN: ${{ inputs.policy_origin || vars.PACKAGE_POLICY_ORIGIN }}
          PACKAGE_LOGIN_ORIGINS: ${{ inputs.deployment == 'test' && (inputs.login_origins || vars.PACKAGE_LOGIN_ORIGINS) || '' }}
          TPCOWORK_DEEPSEEK_BASE_URL: ${{ vars.TPCOWORK_DEEPSEEK_BASE_URL }}
          TPCOWORK_DEEPSEEK_API_KEY: ${{ secrets.TPCOWORK_DEEPSEEK_API_KEY }}
          TPCOWORK_IMAGE_EXTRACT_API_URL: ${{ vars.TPCOWORK_IMAGE_EXTRACT_API_URL }}
          TPCOWORK_IMAGE_EXTRACT_MODEL: ${{ vars.TPCOWORK_IMAGE_EXTRACT_MODEL }}
          TPCOWORK_IMAGE_EXTRACT_API_KEY: ${{ secrets.TPCOWORK_IMAGE_EXTRACT_API_KEY }}
        run: npm run build:win
      - name: Save harness build
        if: >-
          always() && hashFiles('deepseek-harness/apps/desktop/.desktop-build/build-cache/*.json') != '' &&
          steps.harness-build.outputs.cache-matched-key != format('harness-build-windows-{0}-{1}', steps.harness.outputs.commit, hashFiles('deepseek-harness/apps/desktop/.desktop-build/build-cache/*.json'))
        uses: actions/cache/save@v4
        with:
          path: deepseek-harness/apps/desktop/.desktop-build/build-cache
          key: harness-build-windows-${{ steps.harness.outputs.commit }}-${{ hashFiles('deepseek-harness/apps/desktop/.desktop-build/build-cache/*.json') }}
      - name: Verify EXE installation and installed product
        env:
          TPCOWORK_DEEPSEEK_API_KEY: ${{ secrets.TPCOWORK_DEEPSEEK_API_KEY }}
        run: ./scripts/smoke-windows-installer.ps1 -InstallerDirectory dist/installers
      - name: Diagnose browser bridge and expert toolbox (non-blocking)
        continue-on-error: true
        shell: pwsh
        run: ./scripts/smoke-windows-installer.ps1 -InstallerDirectory dist/installers -Diagnostics
      - name: Read installer metadata and verify checksums
        id: package
        run: |
          @'
          import { createHash } from 'node:crypto'
          import { appendFileSync, createReadStream, mkdirSync, readFileSync, writeFileSync } from 'node:fs'
          import { basename, join } from 'node:path'
          const directory = 'dist/installers'
          const info = JSON.parse(readFileSync(join(directory, 'build-info.json'), 'utf8'))
          const { version, installers } = info
          if (typeof version !== 'string' || !/^\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.+-]+)?$/u.test(version)) throw new Error('Missing or invalid Windows package version')
          if (!Array.isArray(installers) || installers.length !== 1 || typeof installers[0] !== 'string' || basename(installers[0]) !== installers[0] || !installers[0].endsWith('.exe')) throw new Error('Expected one Windows installer in build-info.json')
          for (const name of installers) {
            const hash = createHash('sha256')
            for await (const bytes of createReadStream(join(directory, name))) hash.update(bytes)
            const expected = `${hash.digest('hex')}  ${name}`
            if (readFileSync(join(directory, `${name}.sha256`), 'utf8').trimEnd() !== expected) throw new Error(`Windows installer checksum mismatch: ${name}`)
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\nrelease_tag=windows-packages-${version}\n`)
          const notes = [
            `TP Cowork ${version} Windows x64`, '',
            '- Built and installation-tested on Windows Server 2022 x64.',
            `- Product commit: ${info.productCommit}`,
            `- Harness commit: ${info.harnessCommit}`,
            `- Deployment: ${info.deployment}; unsigned NSIS installer.`, '',
            'The EXE, its SHA-256 checksum, and build-info.json are attached.', '',
          ].join('\n')
          mkdirSync('.desktop-build', { recursive: true })
          writeFileSync('.desktop-build/windows-release-notes.md', notes)
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${notes}\n\`\`\`json\n${JSON.stringify(info, null, 2)}\n\`\`\`\n`)
          '@ | node --input-type=module
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: TPCowork-windows-x64-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            tp-cowork/dist/installers/*.exe
            tp-cowork/dist/installers/*.sha256
            tp-cowork/dist/installers/build-info.json
          if-no-files-found: error
          retention-days: 30
      - name: Publish Windows installer prerelease
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.package.outputs.release_tag }}
          BUILD_VERSION: ${{ steps.package.outputs.version }}
        run: |
          $assets = @(Get-ChildItem -LiteralPath dist/installers -File |
            Where-Object { $_.Extension -in @('.exe', '.sha256') -or $_.Name -eq 'build-info.json' } |
            ForEach-Object { $_.FullName })
          $releaseArgs = @('release', 'create', $env:RELEASE_TAG) + $assets + @(
            '--repo', $env:GITHUB_REPOSITORY, '--target', $env:GITHUB_SHA,
            '--title', "TP Cowork $env:BUILD_VERSION Windows x64", '--prerelease', '--latest=false',
            '--notes-file', '.desktop-build/windows-release-notes.md'
          )
          $releaseUrl = & gh @releaseArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "Release: $releaseUrl" >> $env:GITHUB_STEP_SUMMARY
      - name: Retain packaging diagnostics
        if: always() && steps.harness.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: windows-package-logs-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          path: deepseek-harness/apps/desktop/.desktop-build/packaging-runs/
          if-no-files-found: warn
          retention-days: 14
      - name: Retain installed UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installed-ui-${{ github.run_id }}
          path: tp-cowork/test-results/windows-install/
          if-no-files-found: warn
      - name: Retain unverified installer for diagnosis
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unverified-installer-${{ github.run_id }}
          path: tp-cowork/dist/installers/
          if-no-files-found: ignore
          retention-days: 7
