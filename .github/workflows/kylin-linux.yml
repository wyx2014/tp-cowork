name: Build Linux Packages

on:
  workflow_dispatch:
    inputs:
      harness_repository:
        description: '底座 fork 仓库（账号/deepseek-harness）'
        type: string
        default: wyx2014/deepseek-harness
        required: true
      harness_ref:
        description: '底座分支、标签或 commit（需包含 linux-x64 产品打包支持）'
        type: string
        default: feat/tpcowork-workbench-ui
        required: true
      build_version:
        description: '构建版本：auto 按日期和流水线编号生成'
        type: string
        default: auto
        required: true
      hub_environment:
        description: 'TP Cowork Hub 环境：test 测试环境，production 生产环境（地址见 plugins/tpcowork-toolbox/hub-environments.json）'
        type: choice
        options: [test, production]
        default: test
        required: true
      variant:
        description: 'standard 包含浏览器、仅排除 Computer Use；basic 仅底座；full 全部插件'
        type: choice
        options: [standard, basic, full]
        default: standard
        required: true
      publish_release:
        description: '构建成功后发布 GitHub 预发行版，取消则只保留 Actions Artifacts'
        type: boolean
        default: true
        required: true

permissions:
  contents: write

concurrency:
  group: linux-packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-packages:
    # Matches nanobot-gui's Linux build baseline. This is an Ubuntu build,
    # and does not certify installation/UI compatibility on a Kylin machine.
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
        working-directory: tp-cowork
    env:
      DSH_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout TP Cowork
        uses: actions/checkout@v4
        with:
          path: tp-cowork
          persist-credentials: false
      - name: Checkout harness fork
        id: harness
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.harness_repository }}
          ref: ${{ inputs.harness_ref }}
          path: deepseek-harness
          token: ${{ secrets.HARNESS_READ_TOKEN || github.token }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tp-cowork/package-lock.json
      - name: Set up Python for native build tools
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64
      - name: Prepare hosted Linux build dependencies
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          # The hosted Azure mirror can stall on the 61 MB CJK font archive.
          # Retain Ubuntu's mirror list while preferring the official HTTPS endpoint.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          fi
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends \
            build-essential pkg-config dpkg-dev fakeroot libfuse2 dbus-x11 xvfb xauth \
            libgtk-3-0 libnss3 libasound2 libgbm1 libxss1 libxshmfence1 \
            libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 \
            libxdamage1 libxrandr2 libpango-1.0-0 libcairo2 libatspi2.0-0 \
            libx11-xcb1 libxtst6 fonts-noto-cjk xdg-utils
      - name: Install product build tools
        run: npm ci
      - name: Resolve pnpm store directory
        id: pnpm-store
        run: |
          set -euo pipefail
          echo "path=$(node node_modules/pnpm/bin/pnpm.cjs store path)" >> "$GITHUB_OUTPUT"
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-linux-x64-${{ hashFiles('deepseek-harness/pnpm-lock.yaml') }}
          restore-keys: pnpm-store-linux-x64-
      - name: Cache verified runtime downloads
        uses: actions/cache@v4
        with:
          path: deepseek-harness/apps/desktop/.desktop-build/downloads
          key: primary-runtime-downloads-linux-x64-${{ hashFiles('deepseek-harness/scripts/primary-runtime/lock.json') }}
      - name: Cache toolbox Chromium
        if: ${{ inputs.variant != 'basic' }}
        uses: actions/cache@v4
        with:
          path: tp-cowork/plugins/tpcowork-toolbox/runtime/browsers
          key: toolbox-playwright-chromium-linux-x64-${{ hashFiles('tp-cowork/plugins/tpcowork-toolbox/package-lock.json') }}
      - name: Cache toolbox Linux Python wheels
        if: ${{ inputs.variant != 'basic' }}
        uses: actions/cache@v4
        with:
          path: tp-cowork/.cache/toolbox-linux-wheels
          key: toolbox-linux-wheels-${{ hashFiles('tp-cowork/plugins/tpcowork-toolbox/runtime-scripts/requirements-linux-x64-py312.txt') }}
      - name: Install harness build dependencies
        run: node node_modules/pnpm/bin/pnpm.cjs --dir ../deepseek-harness install --frozen-lockfile
      - name: Verify packaging helpers
        run: npm run test:packaging
      - name: Restore harness build
        id: harness-build
        uses: actions/cache/restore@v4
        with:
          path: deepseek-harness/apps/desktop/.desktop-build/build-cache
          key: harness-build-linux-x64-${{ steps.harness.outputs.commit }}-
          restore-keys: harness-build-linux-x64-${{ steps.harness.outputs.commit }}-
      - name: Build and verify AppImage and DEB packages
        env:
          DSH_DESKTOP_BUILD_CACHE_DIR: ${{ github.workspace }}/deepseek-harness/apps/desktop/.desktop-build/build-cache
          PACKAGE_BUILD_VERSION: ${{ inputs.build_version }}
          PACKAGE_VARIANT: ${{ inputs.variant }}
          TPCOWORK_HUB_ENV: ${{ inputs.hub_environment }}
          TPCOWORK_DEEPSEEK_BASE_URL: ${{ vars.TPCOWORK_DEEPSEEK_BASE_URL }}
          TPCOWORK_DEEPSEEK_API_KEY: ${{ secrets.TPCOWORK_DEEPSEEK_API_KEY }}
          TPCOWORK_IMAGE_EXTRACT_API_URL: ${{ vars.TPCOWORK_IMAGE_EXTRACT_API_URL }}
          TPCOWORK_IMAGE_EXTRACT_MODEL: ${{ vars.TPCOWORK_IMAGE_EXTRACT_MODEL }}
          TPCOWORK_IMAGE_EXTRACT_API_KEY: ${{ secrets.TPCOWORK_IMAGE_EXTRACT_API_KEY }}
        run: dbus-run-session -- xvfb-run -a npm run build:linux
      - name: Save harness build
        if: >-
          always() && hashFiles('deepseek-harness/apps/desktop/.desktop-build/build-cache/*.json') != '' &&
          steps.harness-build.outputs.cache-matched-key != format('harness-build-linux-x64-{0}-{1}', steps.harness.outputs.commit, hashFiles('deepseek-harness/apps/desktop/.desktop-build/build-cache/*.json'))
        uses: actions/cache/save@v4
        with:
          path: deepseek-harness/apps/desktop/.desktop-build/build-cache
          key: harness-build-linux-x64-${{ steps.harness.outputs.commit }}-${{ hashFiles('deepseek-harness/apps/desktop/.desktop-build/build-cache/*.json') }}
      - name: Read package metadata and verify checksums
        id: package
        run: |
          set -euo pipefail
          (cd dist/installers && sha256sum --check -- *.sha256)
          node --input-type=module <<'NODE'
          import { appendFileSync, mkdirSync, readFileSync, writeFileSync } from 'node:fs'
          const info = JSON.parse(readFileSync('dist/installers/build-info.json', 'utf8'))
          const { version } = info
          if (typeof version !== 'string' || !version || /[\r\n]/u.test(version)) throw new Error('Missing or invalid Linux package version')
          const basic = info.variant === 'basic'
          const standard = info.variant === 'standard'
          const productName = info.productName
          const tagPrefix = basic ? 'linux-basic-packages' : standard ? 'linux-standard-packages' : 'linux-packages'
          appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\nrelease_tag=${tagPrefix}-${version}\nproduct_name=${productName}\nartifact_suffix=${basic ? '-basic' : standard ? '-standard' : ''}\n`)
          const notes = [
            `${productName} ${version} Linux x64`, '',
            '- Built and runtime-tested on Ubuntu 22.04 x64.',
            basic ? '- Basic: Harness defaults only; no TP Cowork product plugins or native adapters.'
              : standard ? `- Standard: ${info.bundles.length} product plugins; browser included; Computer Use excluded; interface zoom and diagnostics retained.` : '- Full product plugin set.',
            ...(info.hub ? [`- TP Cowork Hub: ${info.hub.environment} (${info.hub.endpoint})`] : []),
            ...(info.guiSmokeVerified ? ['- Both packages passed real GUI startup with the Chromium sandbox enabled.', '- Independent application data; startup diagnostic script attached.'] : []),
            ...(standard ? ['- Browser automation enabled; Product UI, Memory, Archives, Usage and Toolbox surfaces verified.', '- Toolbox retains its own Chromium and offline Python dependencies.'] : []),
            `- Included product bundles: ${info.bundles.join(', ') || '(none)'}`,
            `- Excluded product bundles: ${(info.excludedBundles ?? []).join(', ') || '(none)'}`,
            `- Product commit: ${info.productCommit}`,
            `- Harness commit: ${info.harnessCommit}`,
            '- AppImage and DEB (amd64), standalone and unsigned.',
            '- Kylin installation and UI verification remains required.', '',
            'Verify downloads with `sha256sum -c <package>.sha256`.', '',
          ].join('\n')
          mkdirSync('.desktop-build', { recursive: true })
          writeFileSync('.desktop-build/linux-release-notes.md', notes)
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${notes}\n\`\`\`json\n${JSON.stringify(info, null, 2)}\n\`\`\`\n`)
          NODE
      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: TPCowork${{ steps.package.outputs.artifact_suffix }}-${{ steps.package.outputs.version }}-linux-x64
          path: |
            tp-cowork/dist/installers/*.AppImage
            tp-cowork/dist/installers/*.deb
            tp-cowork/dist/installers/*.sha256
            tp-cowork/dist/installers/build-info.json
            tp-cowork/dist/installers/*.sh
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Publish Linux packages prerelease
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.package.outputs.release_tag }}
          BUILD_VERSION: ${{ steps.package.outputs.version }}
          PRODUCT_NAME: ${{ steps.package.outputs.product_name }}
        run: |
          set -euo pipefail
          assets=(dist/installers/*.AppImage dist/installers/*.deb dist/installers/*.sha256 dist/installers/build-info.json)
          for helper in dist/installers/*.sh; do
            if [ -f "$helper" ]; then assets+=("$helper"); fi
          done
          release_url=$(gh release create "$RELEASE_TAG" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$PRODUCT_NAME $BUILD_VERSION Linux x64" \
            --prerelease --latest=false \
            --notes-file .desktop-build/linux-release-notes.md)
          echo "Release: $release_url" >> "$GITHUB_STEP_SUMMARY"
      - name: Retain Linux GUI startup evidence
        if: always() && inputs.variant != 'full'
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ inputs.variant }}-startup-${{ github.run_id }}
          include-hidden-files: true
          path: tp-cowork/.desktop-build/linux-ui/
          if-no-files-found: warn
          retention-days: 14
      - name: Retain packaging diagnostics
        if: always() && steps.harness.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: linux-package-logs-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          path: deepseek-harness/apps/desktop/.desktop-build/packaging-runs/
          if-no-files-found: warn
          retention-days: 14
      - name: Retain unverified Linux packages for diagnosis
        if: failure() && steps.harness.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: unverified-linux-packages-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            deepseek-harness/apps/desktop/.desktop-build/targets/linux-x64/unsigned-artifacts/*.AppImage
            deepseek-harness/apps/desktop/.desktop-build/targets/linux-x64/unsigned-artifacts/*.deb
            deepseek-harness/apps/desktop/.desktop-build/targets/linux-x64/unsigned-artifacts/builder-debug.yml
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 0
