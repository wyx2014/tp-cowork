- insert:
    - id: tpcowork-core
      name: '@tpcowork/dsh-core'
# TP Cowork ships only the intranet asset-deepseek route; the upstream "DeepSeek" (official,
# API-key) provider stays listed in Settings and confuses people otherwise, since it needs a
# DeepSeek account credential this deployment never has.
- id: llm-deepseek
  disabled: true
