<!doctype html><html><head><meta charset="utf-8"><title>DSH browser pane visual</title>
<style>
/* Approximate DSH light-theme aliases, for layout review only. */
:root{--dsw-alias-label-primary:#1f2329;--dsw-alias-label-secondary:#646a73;--dsw-alias-label-tertiary:#8f959e;--dsw-alias-bg-base:#ffffff;--dsw-alias-bg-layer-1:#f5f6f7;--dsw-alias-border-l2:rgba(31,35,41,.12);--dsw-alias-interactive-bg-hover:rgba(31,35,41,.06);--dsw-alias-interactive-bg-active:rgba(31,35,41,.1);--dsw-specific-menu:rgba(255,255,255,.96);--dsw-alias-brand-primary:#3b6cf6}
html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f7f8fa}
#frame{display:flex;height:100%}#chat{width:46%;border-right:1px solid rgba(31,35,41,.12);padding:24px;box-sizing:border-box;color:#646a73}
#right{flex:1;display:flex;flex-direction:column;min-width:0;background:#fff}#tabs{height:40px;display:flex;align-items:center;gap:8px;padding:0 12px;border-bottom:1px solid rgba(31,35,41,.12);font-size:13px}
#pane{flex:1;min-height:0}
</style></head>
<body><div id="frame"><div id="chat">Chat column</div><div id="right"><div id="tabs"><span id="tab-title"></span></div><div id="pane"></div></div></div><div id="overlay"></div>
<script src="../../test-results/native-pane.js"></script></body></html>
